<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Description settings</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main>
      <h1>Image Description settings</h1>
      <form id="provider-form">
        <label for="base-url">Provider base URL</label>
        <input id="base-url" name="baseUrl" type="url" required />

        <label for="model">Model identifier</label>
        <input id="model" name="model" type="text" required />

        <label for="authentication">Authentication mode</label>
        <select id="authentication" name="authentication">
          <option value="none">No authentication</option>
          <option value="bearer">Bearer token</option>
        </select>

        <label for="api-key">API key</label>
        <input id="api-key" name="apiKey" type="password" autocomplete="off" />

        <button type="submit">Save provider</button>
        <button id="remove-provider" type="button">Remove provider</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
