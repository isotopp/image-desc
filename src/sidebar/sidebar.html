<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Description</title>
    <link rel="stylesheet" href="./sidebar.css" />
  </head>
  <body>
    <main>
      <h1>Image description</h1>
      <p class="intro">
        In Firefox, copy an image. Return here and paste it below with
        <kbd>Ctrl</kbd>+<kbd>V</kbd> or <kbd>Command</kbd>+<kbd>V</kbd>.
      </p>

      <section aria-labelledby="paste-heading">
        <h2 id="paste-heading">Choose an image</h2>
        <div
          id="paste-target"
          class="paste-target"
          contenteditable="true"
          role="textbox"
          aria-multiline="false"
          aria-describedby="paste-help"
          tabindex="0"
        >
          Paste an image here
        </div>
        <p id="paste-help" class="help">
          The extension reads only the image you explicitly paste here.
        </p>
      </section>

      <section id="preview-section" aria-labelledby="preview-heading" hidden>
        <h2 id="preview-heading">Selected image</h2>
        <img id="preview" alt="The image selected for description" />
        <button id="remove-image" type="button">Remove image</button>
      </section>

      <section aria-labelledby="context-heading">
        <h2 id="context-heading">Additional context</h2>
        <label for="manual-context">Additional context</label>
        <textarea
          id="manual-context"
          rows="4"
          autocomplete="off"
          placeholder="Add context the image alone cannot show"
        ></textarea>
        <button id="describe" type="button" disabled>Describe image</button>
        <button id="cancel" type="button" hidden>Cancel</button>
      </section>

      <section aria-labelledby="description-heading">
        <h2 id="description-heading">Description</h2>
        <p id="status" class="status" role="status" aria-live="polite">
          No image selected.
        </p>
        <div id="description" class="description" tabindex="0" hidden></div>
        <button id="copy-description" type="button" hidden>
          Copy description
        </button>
      </section>
    </main>
    <script type="module" src="./sidebar.ts"></script>
  </body>
</html>
